<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Admin Login</title>
<link rel="stylesheet" href="admin.css?v=20261122-clean-login">
</head>
<body>
<main id="login-screen" class="login-screen">
  <form id="login-form" class="login-form">
    <h1>Admin Login</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Login</button>
    <p id="login-status" role="status" aria-live="polite"></p>
  </form>
</main>
<main id="admin-app" hidden></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js?v=20261122-clean-login"></script>
<script src="firebase.js?v=20261122-clean-login"></script>
<script src="admin.js?v=20261122-clean-login"></script>
</body>
</html>
