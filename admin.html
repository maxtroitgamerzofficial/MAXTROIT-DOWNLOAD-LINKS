<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MAXTROIT Visual Editor</title><link rel="stylesheet" href="admin.css?v=visual-editor-4"></head><body>
<section id="login-screen" class="login-screen"><form id="login-form" class="login-form"><h1>MAXTROIT Admin Login</h1><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Login</button><p id="login-status" role="status"></p></form></section>
<main id="admin-app" hidden><header class="topbar"><div class="brand"><strong>MAXTROIT</strong><span>VISUAL EDITOR</span></div><div class="top-actions"><button id="undo" type="button" disabled>↶</button><button id="redo" type="button" disabled>↷</button><button id="reload" type="button">Refresh</button><button id="save" type="button">Save</button><button id="publish" type="button" class="primary">Publish</button><button id="logout" type="button">Logout</button></div></header>
<section class="preview-area"><div class="preview-heading"><b>Website preview</b><span id="editor-status" role="status">Loading…</span></div><iframe id="site-preview" title="Website preview" src="index.html?visualEditorPreview=1"></iframe></section>
<footer class="tool-dock"><div class="selection-info"><span class="live-dot"></span><span id="selected-label">Website par kisi element ko tap karo</span></div><div class="tools"><button id="move-mode" type="button" class="tool-active">↕ Move</button><button id="edit-text" type="button" disabled>Edit text</button><button id="replace-image" type="button" disabled>Replace image</button><input id="image-file" type="file" accept="image/*" hidden><button id="delete" type="button" class="danger" disabled>Delete</button><button id="reset" type="button" disabled>Reset</button></div><p>Text likhne ya code bharne ki zaroorat nahi. Element tap karo, drag karke jagah badlo, ya delete/reset karo.</p></footer></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=visual-editor-4"></script><script src="firebase.js?v=visual-editor-4"></script><script src="admin.js?v=visual-editor-4"></script></body></html>
