<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111027"><title>MAXTROIT Flash Screen Designer</title><link rel="stylesheet" href="admin.css?v=flash-editor-1"><style>body{background:#100d20;color:#f7f3ff;font-family:Arial,sans-serif;margin:0}.flash-head{padding:16px 20px;background:#171329;border-bottom:1px solid #57448c;display:flex;justify-content:space-between;align-items:center;gap:12px}.flash-head h1{font-size:19px;margin:0}.flash-layout{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;padding:18px;max-width:1200px;margin:auto}.flash-controls,.flash-preview{background:#19152d;border:1px solid #57448c;border-radius:14px;padding:18px}.flash-controls h2,.flash-preview h2{font-size:16px;margin:0 0 14px}.flash-controls label{display:grid;gap:7px;margin:12px 0;font-size:13px;color:#d8cff8}.flash-controls input,.flash-controls select{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #66558f;background:#100d20;color:white}.flash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.flash-actions button{padding:11px 15px;border:0;border-radius:8px;background:#7054d8;color:white;font-weight:700}.flash-preview-stage{min-height:370px;border-radius:12px;background:#16091f;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;overflow:hidden}.flash-preview-stage img{width:220px;height:220px;object-fit:contain}.flash-preview-stage strong{font-size:18px}.flash-status{color:#c4b9e9;font-size:13px;min-height:20px}@media(max-width:720px){.flash-layout{grid-template-columns:1fr}.flash-preview-stage{min-height:280px}.flash-preview-stage img{width:160px;height:160px}}</style></head><body><header class="flash-head"><h1>MAXTROIT · Flash Screen Designer</h1><button id="flash-logout" type="button">Logout</button></header><section id="flash-login" class="login-screen"><form id="flash-login-form" class="login-form"><h2>Admin Login</h2><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Login</button><p id="flash-login-status"></p></form></section><main id="flash-app" hidden><div class="flash-layout"><section class="flash-controls"><h2>Flash Screen Settings</h2><label>Animation<select id="fs-animation"><option value="puzzle">Puzzle Assemble</option><option value="fade">Fade In</option><option value="zoom">Zoom In</option><option value="rotate">Rotate</option><option value="flip">3D Flip</option><option value="circle">Circle Reveal</option><option value="slide">Slide Up</option><option value="bounce">Bounce</option><option value="spiral">Spiral</option><option value="shatter">Shatter / Assemble</option><option value="scan">Scan Reveal</option><option value="glow">Neon Glow</option><option value="wave">Wave Reveal</option></select></label><label>Speed<select id="fs-speed"><option value=".5">Very Slow</option><option value=".75">Slow</option><option value="1">Normal</option><option value="1.5">Fast</option><option value="2">Very Fast</option><option value="3">Ultra Fast</option></select></label><label>Duration (ms)<input id="fs-duration" type="number" min="500" max="12000" step="100"></label><label>Delay (ms)<input id="fs-delay" type="number" min="0" max="5000" step="100"></label><label>Logo size<input id="fs-size" type="range" min="100" max="300"></label><label>Background<input id="fs-background" type="color"></label><label>Loading text<input id="fs-label" type="text" maxlength="60"></label><label>Logo image<input id="fs-logo" type="file" accept="image/*"></label><label>Easing<select id="fs-easing"><option value="cubic-bezier(.2,.8,.2,1)">Smooth</option><option value="ease-out">Ease out</option><option value="ease-in-out">Ease in/out</option><option value="linear">Linear</option><option value="cubic-bezier(.34,1.56,.64,1)">Spring</option></select></label><div class="flash-actions"><button id="fs-preview" type="button">Live Preview</button><button id="fs-save" type="button">Save Settings</button></div><p id="fs-status" class="flash-status" role="status">Loading settings…</p></section><section class="flash-preview"><h2>Live Preview</h2><div id="fs-stage" class="flash-preview-stage"><img id="fs-preview-logo" alt="" hidden><strong id="fs-preview-label">MAXTROIT OFFICIAL</strong></div></section></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js?v=flash-editor-1"></script><script src="firebase.js?v=flash-editor-1"></script><script src="flash-screen-editor.js?v=flash-editor-1"></script></body></html>
